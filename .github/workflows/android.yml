name: android

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build JoJo EoH APK
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-37
            build-tools;35.0.0
            ndk;29.0.14206865

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            clang lld llvm cmake ninja-build meson pkg-config patchelf ccache \
            libxml2-utils unzip xz-utils zstd

      - name: Set up pinned host headers
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          cache-environment: true
          init-shell: bash

      - name: Build runtime and APK
        shell: bash -el {0}
        run: |
          set -euo pipefail
          bash ci/setup-deps.sh "$CONDA_PREFIX"
          export GOW3_ARM64_HEADERS="$CONDA_PREFIX"
          export GOW3_NDK="$ANDROID_HOME/ndk/29.0.14206865"
          export GOW3_ANDROID_SDK="$ANDROID_HOME"
          export GOW3_BUILD_TOOLS=35.0.0
          export GOW3_JOBS="$(nproc)"
          bash tools/android/build_bionic_deps.sh
          bash tools/android/build_bionic.sh
          bash tools/android/apk/build_release_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jojo-eoh-arm64-apk
          path: out/release/*.apk
          if-no-files-found: error
